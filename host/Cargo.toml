[package]
name = "vidya-demo-host"
version = "0.1.0"
edition = "2021"
description = "Vidya demo — desktop window (+ Gleam Wasm guest)"
license = "MIT"
publish = false
build = "build.rs"

[workspace]

[[bin]]
name = "vidya-demo"
path = "src/main.rs"

[dependencies]
vidya-demo = { path = "../android-demo" }
# Host needs winit backends; android-demo only enables glow in its base deps.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Load Gleam-compiled Wasm guests (examples/gleam_{fib,gui,shell}).
wasmtime = { version = "29", default-features = false, features = [
    "cranelift",
    "runtime",
] }
