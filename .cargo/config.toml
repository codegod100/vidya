# This project links through `zig cc`, which bundles its own glibc sysroot, so
# builds need no system C toolchain. Paths are relative to the directory cargo
# runs in — the repo root, which is where `just` invokes it.
[env]
CC = { value = "scripts/zcc", relative = true }

[target.x86_64-unknown-linux-gnu]
linker = "scripts/zcc"
